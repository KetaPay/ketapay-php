      summary: Release a milestone to the seller
      description: |
        Pays the seller for this milestone. The buyer's decision, proven one of two ways:

        - **`buyer_confirms` escrows:** the buyer's customer token, once the milestone is
          `delivered`.
        - **`release_code` escrows:** the buyer's code for this milestone in `release_code`,
          with or without the seller's token. Entering it delivers and releases in one step.
          Five wrong codes lock code entry for that escrow for 1 hour and alert the buyer.

        Refused while the milestone is disputed (use `POST /disputes/{id}/concede`) or the escrow
