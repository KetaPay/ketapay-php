info:
  title: KetaPay API
  version: v1
  summary: Put KetaPay escrow inside your product.
  description: |
    The KetaPay API lets any business offer escrow to its own customers: marketplaces,
    freelance and services platforms, property and legal firms, dealers, social commerce and
    anyone else whose customers pay each other. Your server creates a checkout session, your
    customer pays, and KetaPay holds the money until the work or goods are confirmed. Webhooks
    tell your server about every change.

    You can send your customers to KetaPay's hosted checkout, or build every screen yourself on
    this API. Both use the same endpoints.

    ## Libraries

    Official server libraries handle authentication, idempotency keys, retries, pagination and
    webhook signatures for you, and behave the same in every language:

    | Language | Install |
    | --- | --- |
    | Node.js 18+ (also Deno, Bun, Workers) | `npm install @ketapay/node` |
    | PHP 8.1+ | `composer require ketapay/ketapay-php` |
    | Laravel 12+ | `composer require ketapay/ketapay-laravel` |

    Source, examples and changelogs: [github.com/KetaPay](https://github.com/KetaPay).

    ## How an escrow works

    An escrow is an agreement between a **buyer**, who pays, and a **seller**, who gets paid.
    It is split into one or more **milestones**, each with its own amount. A one-off sale is a
    single milestone; a website build might be design, build and launch; a property purchase
    might be deposit, documents and keys.

    1. The buyer pays the full amount up front. KetaPay holds it and the plan is fixed.
    2. For each milestone, in order, the seller marks it **delivered**, with an optional note
       and files (a tracking number, a link to the work, a signed document).
    3. The buyer **releases** it, and the seller is paid for that milestone. If the buyer goes
       quiet and you set `auto_release_hours`, it releases when that time runs out.
    4. When every milestone is released, the escrow is `completed`.

    For in-person deals, set `release.method` to `release_code`: the buyer gets a 6-digit code
    for each milestone and gives it to the seller only once satisfied. The seller entering the
    code delivers and releases that milestone in one step.

    At any point either side can open a dispute, which freezes the affected milestones until
    one side backs down or KetaPay decides.

    **Selling your own goods.** Leave `seller` out of a checkout session and your business is
    the seller: a shop taking escrow as a way to pay. The buyer sees your business's name, each
    release is paid into your KetaPay balance (no commission, it is all yours), and you withdraw
    it from the dashboard's Payouts.

    ## Who can move money

    **Your platform is never a party to your customers' escrows.** Your secret key lets you
    create checkout sessions and read your escrows, but never move escrowed money on its own. Paying,
    delivering, releasing, cancelling, reporting a problem and adding a payout account are
    your customer's decisions, so those calls need proof from that customer as well as your
    key:

    - a **customer token**, which your customer gets by entering a one-time code KetaPay sends
      to their email or phone (see `Customer sessions`), sent in the `KetaPay-Customer-Token` header; or
    - for a `release_code` escrow, the buyer's **6-digit release code**, entered by the seller.

    KetaPay checks that the customer is the right party (only the buyer releases, only the
    seller delivers) and only lets a party settle a dispute against themselves. A leaked secret key on
    its own can therefore never pay out an escrow. KetaPay runs every dispute.

    When you sell your own goods (no `seller` on the checkout session), you are the seller, so
    your key alone marks your milestones delivered. Releasing is still the buyer's decision.

    ## Conventions

    - **Base URL:** `https://api.ketapay.com/v1`. The key decides the environment: `sk_test_`
      keys use the sandbox with test money, `sk_live_` keys move real money. Every object
      carries `livemode`.
    - **Amounts** are integers in kobo (`250000` = ₦2,500.00). Currency is always `NGN`.
    - **Dates** are ISO 8601 strings in UTC.
    - **IDs** are UUIDs. Every object has an `object` field naming its type.
    - **Your references:** every resource you create takes `external_reference` (your own id,
      indexed and filterable) and `metadata` (up to 20 string keys, 40 characters per key, 500
      per value). KetaPay never reads `metadata`.
    - **Lists** are cursor paginated: pass `limit` (1 to 100, default 20) and the `next_cursor`
      from the previous page as `cursor`. Newest first.
    - **Idempotency:** every `POST` requires an `Idempotency-Key` header (any unique string up to
      255 characters, a UUID is ideal). A retry with the same key and body returns the first
      response; the same key with a different body returns `409 idempotency_key_reused`. Keys
      are kept for 24 hours.
    - **Rate limits:** 100 requests per 10 seconds per key. Every response carries
      `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`. Over the limit you
      get `429 rate_limited`; wait until `X-RateLimit-Reset`.
    - **Errors** always have the same shape (see `Error`). Branch on `code`, never on `message`.
    - **Request ids:** every response has a `KetaPay-Request-Id` header. Quote it to support.
    - **Versioning:** additive changes (new fields, new event types, new optional parameters)
      ship without notice, so ignore fields you don't know. Breaking changes only ship in a new
      version, with a dated changelog.

    ## Webhooks

    KetaPay sends events to the endpoints you register (see `Webhook endpoints` and the
    `webhooks` section). Most integrations need one endpoint that receives every event:
    register it without `enabled_events` and ignore the types you don't handle. `refund.*` and
    `chargeback.*` events are not sent yet during the beta; they start when refunds to the
    buyer's card or bank account and chargeback handling go live.

    Each delivery is a `POST` with the `Event` as its JSON body and a signature header:

    ```
    KetaPay-Signature: t=1791640000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
    ```

    `v1` is the hex HMAC-SHA256 of `"{t}.{raw request body}"` keyed with the endpoint's signing
    secret (`whsec_...`). Verify it against the raw body before parsing, compare in constant
    time, and reject anything where `t` is more than 5 minutes old. The official libraries do all
    of this: `ketapay.webhooks.verify()` in Node, `Webhook::verify()` in PHP, and the Laravel
    package verifies every delivery before your listeners run.

    Respond with any `2xx` within 10 seconds. Anything else is retried with exponential backoff
    for 3 days, after which the endpoint is marked `failing` and its owner is emailed. Events can
    arrive more than once and out of order: deduplicate on `id`, and use `GET /escrows/{id}` when
    you need the current state.

    When you rotate a signing secret, both secrets sign every delivery for 24 hours and the
    header carries one `v1` per secret (`t=...,v1=<new>,v1=<old>`); accept the request if any
    `v1` matches.

    ## Sandbox

    `sk_test_` keys run everything against test money. In the sandbox:

    - No email, WhatsApp or SMS is sent. Every one-time code is `123456`.
    - Pay a checkout session with `POST /test_helpers/checkout_sessions/{id}/pay`, or on the
      hosted checkout with the test cards it lists.
    - Move an escrow through any state (deliver, release, auto-release, disputes, evidence
      requests, chargebacks, failed payouts and refunds) with
      `POST /test_helpers/escrows/{id}/simulate`, so you can test every webhook without a real
      buyer or seller.
    - Payout account `0000000000` (any bank) succeeds; `0000000001` fails, so you can test
      `payout.failed`.

    Test helpers return `404 test_mode_only` with a live key.

    ## Security

    - **Keys.** Keep secret keys on your server, never in an app, a browser or a repository.
      Give each system its own key with only the scopes it needs. Roll a key from the dashboard
      at once if it may have leaked; KetaPay also revokes `sk_live_` keys reported by GitHub
      secret scanning and emails you.
    - **Customer tokens** are as sensitive as a password for 15 minutes. Keep them on your
      server, never log them, and never pass them to another customer.
    - **Card numbers** must never touch your systems. Collect cards only through KetaPay's
      hosted checkout or `@ketapay/checkout`.
    - **Webhooks.** Verify every signature against the raw body, reject old timestamps, and
      treat the event as a hint: fetch the object before acting on large amounts. Deliveries
      come from the IP addresses listed at docs.ketapay.com/webhooks/ips.
    - **HTTPS only.** Plain HTTP requests are refused, not redirected. TLS 1.2 or later.
    - **Your customers' data.** You receive your customers' names, emails and phone numbers back
      from KetaPay. Handle them under your data processing agreement with KetaPay and the
      Nigeria Data Protection Act 2023.
    - **Reporting a vulnerability:** security@ketapay.com (see ketapay.com/.well-known/security.txt).
