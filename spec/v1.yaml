          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotParty'
        '429':
          $ref: '#/components/responses/RateLimited'
  /payout_accounts/{id}/confirm:
    post:
      operationId: confirmPayoutAccount
      tags:
        - Payout accounts
      summary: Confirm a payout account with the seller's code
      description: |
        Activates the account. Five wrong codes cancel it; start again with
        `POST /payout_accounts`. Payouts waiting in the seller's KetaPay balance are sent to it
        straight away.
      x-required-scope: payout_accounts:write
      security:
        - secretKey: []
          customerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OneTimeCode'
      responses:
        '200':
          description: The active payout account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'
        '400':
          $ref: '#/components/responses/CodeRejected'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotParty'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /payout_accounts/{id}:
    delete:
      operationId: deletePayoutAccount
      tags:
        - Payout accounts
      summary: Remove a payout account
      description: |
        Removing the active account makes payouts wait in the seller's KetaPay balance until they
        confirm a new one. Payouts already sent are not affected.
      x-required-scope: payout_accounts:write
      security:
        - secretKey: []
          customerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotParty'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      tags:
        - Webhook endpoints
      summary: Create a webhook endpoint
      description: |
        Registers an HTTPS URL to receive events. Without `enabled_events` the endpoint receives
        every event, including types added later. The response is the only time `secret` is
        shown; store it to verify signatures. Up to 10 endpoints per environment.
      x-required-scope: webhook_endpoints:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpointRequest'
            example:
              url: https://example.com/webhooks/ketapay
              enabled_events:
                - escrow.funded
                - milestone.delivered
                - milestone.released
                - escrow.completed
                - escrow.refunded
                - dispute.opened
                - dispute.resolved
              description: Order service
      responses:
        '201':
          description: Webhook endpoint created; `secret` is shown this once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    required:
                      - secret
                    properties:
                      secret:
                        type: string
                        description: Signing secret. Shown only in this response.
                        example: whsec_9f8c1e2d7b6a5f4e3d2c1b0a9f8e7d6c
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listWebhookEndpoints
      tags:
        - Webhook endpoints
      summary: List webhook endpoints
      x-required-scope: webhook_endpoints:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of webhook endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /webhook_endpoints/{id}:
    post:
      operationId: updateWebhookEndpoint
      tags:
        - Webhook endpoints
      summary: Update a webhook endpoint
      description: Change the URL or the events, or re-enable an endpoint marked `failing` once it is fixed.
      x-required-scope: webhook_endpoints:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookEndpointRequest'
            example:
              status: enabled
      responses:
        '200':
          description: The updated endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: getWebhookEndpoint
      tags:
        - Webhook endpoints
      summary: Get a webhook endpoint
      x-required-scope: webhook_endpoints:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The webhook endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteWebhookEndpoint
      tags:
        - Webhook endpoints
      summary: Delete a webhook endpoint
      description: Stops all deliveries to this endpoint, including pending retries.
      x-required-scope: webhook_endpoints:write
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The endpoint was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /webhook_endpoints/{id}/test:
    post:
      operationId: testWebhookEndpoint
      tags:
        - Webhook endpoints
      summary: Send a test event
      description: |
        Sends a signed sample event of the type you choose to the endpoint right now and reports
        what your server answered. Works with test and live keys; the event has `livemode` false
        and an id starting `evt_test_`, so your handler can skip it.
      x-required-scope: webhook_endpoints:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  $ref: '#/components/schemas/EventType'
            example:
              type: escrow.funded
      responses:
        '200':
          description: What your endpoint answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /webhook_endpoints/{id}/rotate_secret:
    post:
      operationId: rotateWebhookSecret
      tags:
        - Webhook endpoints
      summary: Rotate the signing secret
      description: |
        Issues a new signing secret, shown only in this response. The old secret keeps signing
        alongside it for 24 hours (two `v1` values in `KetaPay-Signature`), so you can deploy
        the new one without missing events.
      x-required-scope: webhook_endpoints:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                required:
                  - object
                  - secret
                  - previous_secret_expires_at
                properties:
                  object:
                    type: string
                    const: webhook_secret
                  secret:
                    type: string
                    example: whsec_2b7d9f1e3c5a8b0d4f6e2a9c7b1d3f5e
                  previous_secret_expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events:
    get:
      operationId: listEvents
      tags:
        - Events
      summary: List events
      description: Events from the last 30 days, newest first.
      x-required-scope: events:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/EventType'
        - name: created_gte
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /events/{id}:
    get:
      operationId: getEvent
      tags:
        - Events
      summary: Get an event
      x-required-scope: events:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /test_helpers/checkout_sessions/{id}/pay:
    post:
      operationId: testPayCheckoutSession
      tags:
        - Test helpers
      summary: Pay a checkout session (sandbox)
      description: Funds the session as if the buyer paid, creates the escrow and sends `escrow.funded`.
      x-required-scope: test_helpers:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - card
                    - bank_transfer
                  default: bank_transfer
      responses:
        '200':
          description: The completed checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /test_helpers/escrows/{id}/simulate:
    post:
      operationId: testSimulateEscrow
      tags:
        - Test helpers
      summary: Simulate an escrow event (sandbox)
      description: |
        Does what a buyer, seller, bank or KetaPay mediator would do, with the same rules and
        the same webhooks as the real thing (an action that would be refused for real is
        refused here too, so you see the same errors).

        | `action` | Acts as | Needs |
        | --- | --- | --- |
        | `deliver` | Seller | `milestone_id` |
        | `release` | Buyer | `milestone_id` |
        | `auto_release` | The clock: skips to the end of the auto-release window | `milestone_id` |
        | `cancel` | `actor` (`buyer` or `seller`) | |
        | `open_dispute` | `actor` | `milestone_id` optional, `reason` |
        | `request_evidence` | KetaPay | `from` (`buyer`, `seller` or `both`) |
        | `resolve_dispute` | KetaPay | `outcome`, `refunded_amount` for a partial refund |
        | `open_chargeback` | The buyer's card bank | `amount` optional |
        | `close_chargeback` | The card bank | `chargeback_status` (`won` or `lost`) |
        | `fail_payout` | The seller's bank | `milestone_id` |
        | `fail_refund` | The buyer's card bank | `milestone_id` |
      x-required-scope: test_helpers:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
            example:
              action: deliver
              milestone_id: 7c2e9a41-3b5d-4f6e-8a1c-9d0b2e4f6a83
      responses:
        '200':
          $ref: '#/components/responses/EscrowUpdated'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
webhooks:
  checkout_session.expired:
    post:
      operationId: onCheckoutSessionExpired
      tags:
        - Events
      summary: checkout_session.expired
      description: A checkout session reached `expires_at` without being paid. `data.object` is the `CheckoutSession`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  escrow.funded:
    post:
      operationId: onEscrowFunded
      tags:
        - Events
      summary: escrow.funded
      description: |
        The buyer paid and KetaPay holds the money. `data.object` is the new `Escrow`, whose
        `checkout_session_id` and `external_reference` tie it to your record. This is the signal
        to mark the order or project paid, not the checkout SDK's callback.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  milestone.delivered:
    post:
      operationId: onMilestoneDelivered
      tags:
        - Events
      summary: milestone.delivered
      description: |
        The seller marked a milestone delivered. `data.object` is the `Escrow`;
        `data.milestone_id` names the milestone. Its `auto_release_at` is set if the escrow
        auto-releases.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  milestone.released:
    post:
      operationId: onMilestoneReleased
      tags:
        - Events
      summary: milestone.released
      description: |
        A milestone was paid to the seller: the buyer released it, the release code was entered,
        the auto-release time ran out, or KetaPay decided a dispute for the seller.
        `data.object` is the `Escrow`; `data.milestone_id` names the milestone, whose
        `commission` is your earning.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  escrow.completed:
    post:
      operationId: onEscrowCompleted
      tags:
        - Events
      summary: escrow.completed
      description: |
        The escrow ended with at least one milestone paid to the seller: every milestone is
        released, or the rest were refunded. Nothing more will move.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  escrow.refunded:
    post:
      operationId: onEscrowRefunded
      tags:
        - Events
      summary: escrow.refunded
      description: |
        The escrow ended with everything returned to the buyer: it was cancelled before any
        release, or KetaPay decided a dispute for the buyer. No commission is earned.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  dispute.opened:
    post:
      operationId: onDisputeOpened
      tags:
        - Events
      summary: dispute.opened
      description: The buyer reported a problem. The money stays held. `data.object` is the `Dispute`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  dispute.evidence_requested:
    post:
      operationId: onDisputeEvidenceRequested
      tags:
        - Events
      summary: dispute.evidence_requested
      description: |
        KetaPay needs more evidence. `data.object.awaiting_evidence_from` says from whom and
        `evidence_due_at` by when; KetaPay also messages them. Prompt them in your app if you
        built your own dispute screens. Missing the deadline lets KetaPay decide without it.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  dispute.evidence_submitted:
    post:
      operationId: onDisputeEvidenceSubmitted
      tags:
        - Events
      summary: dispute.evidence_submitted
      description: The buyer or the seller added evidence. `data.object` is the `Dispute`. The evidence itself is not included.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  dispute.resolved:
    post:
      operationId: onDisputeResolved
      tags:
        - Events
      summary: dispute.resolved
      description: |
        The dispute ended. `data.object.outcome` says how. `milestone.released`,
        `escrow.completed` or `escrow.refunded` events follow as the money moves.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  refund.sent:
    post:
      operationId: onRefundSent
      tags:
        - Events
      summary: refund.sent
      description: |
        Money went back to the buyer's card or bank account. `data.object` is the `Refund`.
        Card refunds can take 5 to 10 working days to show on the buyer's statement.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  refund.failed:
    post:
      operationId: onRefundFailed
      tags:
        - Events
      summary: refund.failed
      description: |
        The refund couldn't go back the way the money came (expired or closed card, account that
        can't receive). The money is safe in the buyer's KetaPay balance and KetaPay has asked
        them to withdraw it. `data.object` is the `Refund`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  chargeback.opened:
    post:
      operationId: onChargebackOpened
      tags:
        - Events
      summary: chargeback.opened
      description: |
        The buyer's card bank opened a chargeback. KetaPay is contesting it; you don't need to
        act. `data.object` is the `Chargeback`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  chargeback.closed:
    post:
      operationId: onChargebackClosed
      tags:
        - Events
      summary: chargeback.closed
      description: |
        The bank decided. `data.object.status` is `won` (nothing changes) or `lost` (the amount
        is recovered from the seller and your commission on the affected milestones is reversed;
        see `commission_reversed`).
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  payout.sent:
    post:
      operationId: onPayoutSent
      tags:
        - Events
      summary: payout.sent
      description: A seller's payout for a milestone reached their bank. `data.object` is the `Payout`.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
  payout.failed:
    post:
      operationId: onPayoutFailed
      tags:
        - Events
      summary: payout.failed
      description: |
        The bank rejected a seller's payout. The money is back in the seller's KetaPay balance
        and KetaPay has asked them to fix their account; it is sent again once they do.
      parameters:
        - $ref: '#/components/parameters/SignatureHeader'
      requestBody:
        $ref: '#/components/requestBodies/EventDelivery'
      responses:
        '200':
          $ref: '#/components/responses/EventAcknowledged'
components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test_... or sk_live_...
      description: |
        `Authorization: Bearer <secret key>`. Secret keys belong to your organisation, are shown
        once when created in the dashboard, and are scoped (see `x-required-scope` on each
        operation). Keep them on your server. Live keys are issued after your business is
        verified. Publishable keys (`pk_`) are only for `@ketapay/checkout` and don't work here.
    customerToken:
      type: apiKey
      in: header
      name: KetaPay-Customer-Token
      description: |
        Proof that your customer approved this call, from `POST /customer_sessions/{id}/verify`.
        Sent together with your secret key. Valid for 15 minutes, for that customer's escrows
        only.
  headers:
    KetaPay-Request-Id:
      description: Unique id of this request. Quote it to support.
      schema:
        type: string
        example: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this operation. Retries with the same key return the first result.
      schema:
        type: string
        maxLength: 255
        example: 7f3e2a10-6c4d-4b8e-9a1f-2d5c8e7b6a40
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page
      schema:
        type: string
    ExternalReference:
      name: external_reference
      in: query
      description: Only items with this `external_reference`
      schema:
        type: string
    SignatureHeader:
      name: KetaPay-Signature
      in: header
      required: true
      description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body">`'
      schema:
        type: string
        example: t=1791640000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
  requestBodies:
    EventDelivery:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Event'
    OneTimeCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - code
            properties:
              code:
                type: string
                pattern: ^\d{6}$
                example: '482913'
  responses:
    EscrowUpdated:
      description: The updated escrow
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Escrow'
    EventAcknowledged:
      description: Any 2xx acknowledges the event
    InvalidRequest:
      description: A parameter is missing or invalid; `param` names it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request_error
              code: parameter_invalid
              message: buyer.phone must be a Nigerian mobile number in E.164 format, like +2348012345678.
              param: buyer.phone
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    CodeRejected:
      description: Wrong or expired code (`code_invalid`, `code_expired`, `too_many_attempts`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request_error
              code: code_invalid
              message: That code is not correct. 4 attempts left.
              param: code
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    Unauthenticated:
      description: The key is missing, malformed or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: authentication_error
              code: api_key_invalid
              message: This API key is invalid or has been revoked.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    Forbidden:
      description: The key lacks the scope, or the organisation can't do this yet (for example live keys before verification)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: permission_error
              code: missing_scope
              message: This key does not have the checkout_sessions:write scope.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    NotParty:
      description: The customer token is missing, expired, or belongs to someone who can't do this; or the buyer must verify their identity first (`verification_required`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: permission_error
              code: customer_not_allowed
              message: Only the buyer can release this milestone.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    StateConflict:
      description: Not allowed in the current state (`escrow_state_invalid`, `milestone_not_current`, `milestone_not_delivered`, `dispute_open`, `escrow_under_review`, `checkout_session_not_open`, `release_code_locked`), or the idempotency key was reused
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request_error
              code: dispute_open
              message: This escrow has an open dispute. KetaPay will release or refund it when the dispute ends.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    NotFound:
      description: No such object for this organisation and environment
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: invalid_request_error
              code: resource_not_found
              message: No escrow with id 3b1f6c2e-8d4a-4e7b-9c1d-2a5f8e6b7c90.
              param: id
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    IdempotencyConflict:
      description: The Idempotency-Key was used before with a different request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: idempotency_error
              code: idempotency_key_reused
              message: This Idempotency-Key was already used with a different request.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    RateLimited:
      description: Too many requests for this key
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix seconds when the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              type: rate_limit_error
              code: rate_limited
              message: Too many requests. Retry after the time in X-RateLimit-Reset.
              param: null
              request_id: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
  schemas:
    Amount:
      type: integer
      minimum: 0
      description: Amount in kobo
      example: 45000000
    Metadata:
      type: object
      maxProperties: 20
      propertyNames:
        maxLength: 40
      additionalProperties:
        type: string
        maxLength: 500
      description: Your own key-value pairs. KetaPay stores them and never reads them.
      example:
        project_id: '4471'
    ExternalReference:
      type:
        - string
        - 'null'
      maxLength: 255
      description: Your own id for this object, for example your order or project id. Filterable.
      example: proj_4471
    Email:
      type: string
      format: email
      maxLength: 254
      description: Email address. Matched without regard to case.
      example: ada@example.com
    Phone:
      type: string
      pattern: ^\+234[789][01]\d{8}$
      description: Nigerian mobile number in E.164 format
      example: '+2348012345678'
    Image:
      type: object
      description: |
        Send `url`, an HTTPS link to a JPEG, PNG, HEIC or WebP. KetaPay copies the image when the
        session is created. Responses carry KetaPay's own `url` plus a small `thumbnail_url`.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: |
            In a request, your HTTPS link. In a response, a link to KetaPay's copy, valid for 1 hour.
        thumbnail_url:
          type: string
          format: uri
          readOnly: true
        alt:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Short description, for screen readers
    Attachment:
      type: object
      description: |
        A document. Send `url`, an HTTPS link KetaPay copies, so it survives your copy being deleted
        or changed. Responses carry KetaPay's own `url` and the `sha256` of what was copied.
      required:
        - url
      properties:
        name:
          type: string
          maxLength: 120
          example: Project brief.pdf
        url:
          type: string
          format: uri
          description: |
            In a request, your HTTPS link. In a response, a link to KetaPay's copy, valid for 1 hour.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          readOnly: true
          example: 9f2c4e1a7b3d5f6e8a0c2b4d6f8e1a3c5b7d9f0e2a4c6b8d0f1e3a5c7b9d2f4e
          description: Fingerprint of the copy, to prove the file is the one that was agreed
    DeliveryAttachment:
      type: object
      description: |
        Proof of delivery. Send either `file` (an id from `POST /files` with purpose `delivery`,
        for a photo or video the seller took) or `url` (an HTTPS link KetaPay copies).
      anyOf:
        - type: object
          required:
            - file
          properties:
            file:
              type: string
              format: uuid
        - type: object
          required:
            - url
          properties:
            url:
              type: string
              format: uri
      properties:
        name:
          type: string
          maxLength: 120
          example: Delivered designs.pdf
        file:
          type: string
          format: uuid
        url:
          type: string
          format: uri
    Deleted:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
        deleted:
          type: boolean
          const: true
    ListMeta:
      type: object
      required:
        - object
        - has_more
        - next_cursor
      properties:
        object:
          type: string
          const: list
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
          description: Pass as `cursor` to get the next page; null on the last page
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - code
            - message
            - param
            - request_id
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - idempotency_error
                - rate_limit_error
                - api_error
              description: The broad class. `api_error` means something failed on KetaPay's side; retry with the same Idempotency-Key.
            code:
              type: string
              description: |
                Specific reason. Known codes: `parameter_missing`, `parameter_invalid`,
                `contact_required`, `party_identity_conflict`, `parties_must_differ`, `milestones_total_mismatch`, `commission_exceeds_contract`,
                `commission_not_allowed`,
                `release_settings_invalid`, `verification_required`, `checkout_session_not_open`,
                `escrow_already_flagged`, `escrow_state_invalid`, `milestone_not_current`,
                `milestone_not_delivered`, `dispute_open`, `escrow_under_review`,
                `release_code_invalid`, `release_code_locked`, `code_invalid`, `code_expired`,
                `too_many_attempts`, `customer_token_required`, `customer_token_expired`,
                `customer_not_allowed`, `bank_account_not_found`, `file_too_large`,
                `file_type_not_allowed`, `file_not_usable`, `resource_not_found`,
                `api_key_invalid`, `api_key_expired`, `missing_scope`, `live_mode_not_enabled`,
                `idempotency_key_missing`, `idempotency_key_reused`, `rate_limited`, `test_mode_only`,
                `internal_error`. New codes may be added.
              example: parameter_invalid
            message:
              type: string
              description: Human-readable explanation for your logs. Do not branch on it.
            param:
              type:
                - string
                - 'null'
              description: The request field at fault, in dot notation
              example: buyer.phone
            request_id:
              type: string
              example: req_01J9ZK7M2Q4V8XW3B6N5T0R1YH
    Category:
      type: string
      enum:
        - goods
        - services
        - property
        - vehicle
        - digital
        - other
      default: other
      description: What kind of deal this is. KetaPay uses it for risk checks and dispute handling.
    Release:
      type: object
      properties:
        method:
          type: string
          enum:
            - buyer_confirms
            - release_code
          default: buyer_confirms
          description: |
            `buyer_confirms`: the seller delivers each milestone and the buyer releases it.
            `release_code`: in person; the buyer gives the seller a 6-digit code per milestone
            once satisfied, and the seller entering it releases that milestone.
        auto_release_hours:
          type:
            - integer
            - 'null'
          minimum: 24
          maximum: 720
          default: null
          description: |
            `buyer_confirms` only. Hours after a milestone is delivered before it releases on its
            own if the buyer neither releases it nor reports a problem. Null means it never
            releases without the buyer. Typical values: 48 for goods, 168 for services.
    MilestoneInput:
      type: object
      required:
        - title
        - amount
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Design
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          minimum: 1
        due_date:
          type:
            - string
            - 'null'
          format: date
          description: When the seller expects to deliver. Shown to both sides; KetaPay does not act on it.
    PartyInput:
      type: object
      description: At least one of `email` and `phone`. Both is better.
      anyOf:
        - type: object
          required:
            - email
          properties:
            email:
              $ref: '#/components/schemas/Email'
        - type: object
          required:
            - phone
          properties:
            phone:
              $ref: '#/components/schemas/Phone'
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
        name:
          type:
            - string
            - 'null'
          maxLength: 100
          description: Shown on the checkout and in messages until the person sets their own name on KetaPay
          example: Ada Obi
    BusinessSeller:
      type: object
      required:
        - type
        - name
      description: |
        The seller when you sell your own goods (a checkout session sent without `seller`): your
        business, by the name your customers see (your checkout name, else your trading name, else
        your legal name). Releases are paid into your KetaPay balance.
      properties:
        type:
          type: string
          enum:
            - business
        name:
          type: string
          example: Ade Gadgets
    CommissionInput:
      type: object
      required:
        - rate_bps
      description: |
        Your cut, taken from the seller's side of each release. Never charged on money refunded
        to the buyer. `rate_bps` is basis points (500 = 5%). `min_amount` and `max_amount` apply
        to the whole escrow; each milestone's release carries its share. Must be within the
        maximum rate in your KetaPay agreement. Not allowed when you sell your own goods (no
        `seller`): `commission_not_allowed`.
      properties:
        rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          example: 1000
        min_amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          default: 0
        max_amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          default: null
    CreateCheckoutSessionRequest:
      type: object
      required:
        - amount
        - title
        - description
        - buyer
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          minimum: 1
          description: The full agreed price in kobo, before KetaPay's fee. Must equal the sum of `milestones` when given.
        currency:
          type: string
          enum:
            - NGN
          default: NGN
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: What is being bought, in a few words
          example: Company website
        description:
          type: string
          minLength: 20
          maxLength: 2000
          description: |
            What was agreed, in enough detail for someone else to judge a dispute: condition,
            specification, scope of work, what is included. Shown to both sides.
        images:
          type: array
          maxItems: 10
          description: Photos of what is being bought. The first is the cover image.
          items:
            $ref: '#/components/schemas/Image'
        attachments:
          type: array
          maxItems: 10
          description: Documents, such as a brief, a contract, an invoice or property papers
          items:
            $ref: '#/components/schemas/Attachment'
        url:
          type:
            - string
            - 'null'
          format: uri
          description: The listing, project or deal on your site
        milestones:
          type: array
          minItems: 1
          maxItems: 20
          description: Stages released one at a time, in this order. Leave out for a single payment.
          items:
            $ref: '#/components/schemas/MilestoneInput'
        buyer:
          $ref: '#/components/schemas/PartyInput'
        seller:
          allOf:
            - $ref: '#/components/schemas/PartyInput'
          description: |
            Who gets paid. Leave it out when you sell your own goods: your business is the seller,
            by its name, and each release is paid into your KetaPay balance.
        release:
          $ref: '#/components/schemas/Release'
        commission:
          oneOf:
            - $ref: '#/components/schemas/CommissionInput'
            - type: 'null'
          default: null
        expires_at:
          type: string
          format: date-time
          description: When the session stops accepting payment. Between 15 minutes and 7 days from now; defaults to 24 hours.
        return_url:
          type: string
          format: uri
          description: Where the buyer goes after paying. KetaPay appends `?checkout_session_id=<id>`.
        cancel_url:
          type:
            - string
            - 'null'
          format: uri
          description: Where the buyer goes if they leave without paying
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
        metadata:
          $ref: '#/components/schemas/Metadata'
    CheckoutSessionStatus:
      type: string
      enum:
        - open
        - complete
        - expired
        - cancelled
      description: |
        `open`: waiting for payment. `complete`: paid, `escrow_id` is set. `expired`: not paid by
        `expires_at`. `cancelled`: you cancelled it.
    Fees:
      type: object
      required:
        - amount
        - buyer_fee
        - buyer_vat
        - buyer_total
        - seller_fee
        - commission
        - seller_payout
      description: |
        Totals for the whole escrow, in kobo. `buyer_total = amount + buyer_fee + buyer_vat` and
        `seller_payout = amount - seller_fee - commission`. Until everything is released these
        are what will apply; each milestone shows its own share.
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        buyer_fee:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: KetaPay's fee paid by the buyer (1.5%)
          example: 2250000
        buyer_vat:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: 7.5% VAT on `buyer_fee`
          example: 168750
        buyer_total:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: What the buyer is charged
          example: 152418750
        seller_fee:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: KetaPay's fee taken from the seller's payouts (1.5%)
          example: 2250000
        commission:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Your commission
          example: 15000000
        seller_payout:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: What the seller receives once everything is released
          example: 132750000
    CheckoutSession:
      type: object
      required:
        - id
        - object
        - livemode
        - status
        - url
        - amount
        - currency
        - fees
        - category
        - title
        - description
        - images
        - attachments
        - milestones
        - buyer
        - seller
        - release
        - commission
        - escrow_id
        - return_url
        - cancel_url
        - external_reference
        - metadata
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: checkout_session
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/CheckoutSessionStatus'
        url:
          type: string
          format: uri
          description: The hosted checkout. Open it with `@ketapay/checkout` or redirect the buyer to it.
          example: https://app.ketapay.com/checkout/2c9a7f4e-1b3d-4e6a-8f2c-5d7b9e1a3c60
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          type: string
          const: NGN
        fees:
          $ref: '#/components/schemas/Fees'
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
        description:
          type: string
        images:
          type: array
          description: KetaPay's copies, in order; the first is the cover
          items:
            $ref: '#/components/schemas/Image'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        url_on_platform:
          type:
            - string
            - 'null'
          format: uri
          description: The `url` you sent at creation
        milestones:
          type: array
          description: The plan. One entry for a single payment.
          items:
            $ref: '#/components/schemas/MilestoneInput'
        buyer:
          $ref: '#/components/schemas/PartyInput'
        seller:
          description: The seller as you sent them, or your business when you sent none
          oneOf:
            - $ref: '#/components/schemas/PartyInput'
            - $ref: '#/components/schemas/BusinessSeller'
        release:
          $ref: '#/components/schemas/Release'
        commission:
          oneOf:
            - $ref: '#/components/schemas/CommissionInput'
            - type: 'null'
        escrow_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Set once the buyer has paid
        return_url:
          type:
            - string
            - 'null'
          format: uri
        cancel_url:
          type:
            - string
            - 'null'
          format: uri
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
        metadata:
          $ref: '#/components/schemas/Metadata'
        expires_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    CreateCustomerSessionRequest:
      type: object
      description: Exactly one of `email` and `phone`; the code goes there.
      oneOf:
        - type: object
          required:
            - email
          properties:
            email:
              $ref: '#/components/schemas/Email'
        - type: object
          required:
            - phone
          properties:
            phone:
              $ref: '#/components/schemas/Phone'
      properties:
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
    CustomerSession:
      type: object
      required:
        - id
        - object
        - email
        - phone
        - status
        - channel
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: customer_session
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        status:
          type: string
          enum:
            - code_sent
            - verified
            - failed
            - expired
        channel:
          type: string
          enum:
            - email
            - whatsapp
            - sms
          description: Where the code was delivered
        expires_at:
          type: string
          format: date-time
          description: When the code stops working
    CustomerToken:
      type: object
      required:
        - object
        - token
        - expires_at
        - email
        - phone
        - has_claimed_account
      properties:
        object:
          type: string
          const: customer_token
        token:
          type: string
          description: Send as `KetaPay-Customer-Token`. Shown only here.
          example: ctk_test_4f9a2c7e1b8d6a3f5e0c9b2d7a1e4f8c
        expires_at:
          type: string
          format: date-time
        email:
          description: The customer's email on KetaPay, if known
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          description: The customer's phone on KetaPay, if known
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        has_claimed_account:
          type: boolean
    BankTransferInstructions:
      type: object
      required:
        - object
        - checkout_session_id
        - bank_name
        - account_number
        - account_name
        - amount
        - expires_at
      properties:
        object:
          type: string
          const: bank_transfer_instructions
        checkout_session_id:
          type: string
          format: uuid
        bank_name:
          type: string
          example: Zenith Bank
        account_number:
          type: string
          pattern: ^\d{10}$
          example: '9912345678'
        account_name:
          type: string
          example: KetaPay Escrow / Ada Obi
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Transfer exactly this (the buyer's total)
          example: 152418750
        expires_at:
          type: string
          format: date-time
    EscrowStatus:
      type: string
      enum:
        - active
        - disputed
        - completed
        - refunded
      description: |
        `active`: money held, milestones in progress. `disputed`: the buyer reported a problem;
        KetaPay is handling it. `completed`: ended with at least one milestone paid to the
        seller. `refunded`: ended with everything returned to the buyer. An escrow only exists
        once the buyer has paid.
    MilestoneStatus:
      type: string
      enum:
        - funded
        - delivered
        - released
        - refunded
        - disputed
      description: |
        `funded`: money held, waiting for the seller. `delivered`: the seller says it is done;
        waiting for the buyer. `released`: paid to the seller. `refunded`: returned to the
        buyer. `disputed`: frozen until KetaPay resolves the dispute.
    Party:
      type: object
      required:
        - email
        - phone
        - name
        - has_claimed_account
      properties:
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        name:
          type:
            - string
            - 'null'
        has_claimed_account:
          type: boolean
          description: Whether the person has signed in to KetaPay
    Delivery:
      type: object
      required:
        - note
        - attachments
        - delivered_at
      properties:
        note:
          type:
            - string
            - 'null'
          maxLength: 160
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        delivered_at:
          type: string
          format: date-time
    Payout:
      type: object
      required:
        - id
        - object
        - livemode
        - escrow_id
        - milestone_id
        - amount
        - status
        - bank_name
        - account_number_last4
        - sent_at
        - failure_reason
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: payout
        livemode:
          type: boolean
        escrow_id:
          type: string
          format: uuid
        milestone_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        status:
          type: string
          enum:
            - awaiting_account
            - processing
            - sent
            - failed
          description: |
            `awaiting_account`: in the seller's KetaPay balance until they confirm a payout
            account. `processing`: transfer started. `sent`: reached the bank. `failed`: rejected
            by the bank and back in the seller's balance.
        bank_name:
          type:
            - string
            - 'null'
        account_number_last4:
          type:
            - string
            - 'null'
          example: '6789'
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
        failure_reason:
          type:
            - string
            - 'null'
          example: Account closed
    Milestone:
      type: object
      required:
        - id
        - object
        - position
        - title
        - description
        - amount
        - due_date
        - status
        - delivery
        - auto_release_at
        - seller_fee
        - commission
        - seller_payout
        - payout
        - refund
        - released_at
        - refunded_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: milestone
        position:
          type: integer
          minimum: 1
          description: Order in the plan, starting at 1
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        amount:
          $ref: '#/components/schemas/Amount'
        due_date:
          type:
            - string
            - 'null'
          format: date
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        delivery:
          description: What the seller sent when marking it delivered. Null before that.
          oneOf:
            - $ref: '#/components/schemas/Delivery'
            - type: 'null'
        auto_release_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When it releases if the buyer does nothing. Null if the escrow never auto-releases or it isn't delivered yet.
        seller_fee:
          $ref: '#/components/schemas/Amount'
        commission:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Your share from this milestone's release
        seller_payout:
          $ref: '#/components/schemas/Amount'
        payout:
          description: Where the seller's money for this milestone is. Null until released.
          oneOf:
            - $ref: '#/components/schemas/Payout'
            - type: 'null'
        refund:
          description: Where the buyer's money for this milestone is. Null unless refunded.
          oneOf:
            - $ref: '#/components/schemas/Refund'
            - type: 'null'
        released_at:
          type:
            - string
            - 'null'
          format: date-time
        refunded_at:
          type:
            - string
            - 'null'
          format: date-time
    TimelineEntry:
      type: object
      required:
        - type
        - milestone_id
        - occurred_at
      properties:
        type:
          type: string
          enum:
            - funded
            - milestone_delivered
            - milestone_released
            - milestone_refunded
            - dispute_opened
            - dispute_resolved
            - flagged
            - cancelled
            - completed
            - refunded
            - chargeback_opened
            - chargeback_closed
          description: New entry types may be added.
        milestone_id:
          type:
            - string
            - 'null'
          format: uuid
        occurred_at:
          type: string
          format: date-time
    Escrow:
      type: object
      required:
        - id
        - object
        - livemode
        - status
        - amount
        - currency
        - fees
        - category
        - title
        - description
        - images
        - attachments
        - milestones
        - buyer
        - seller
        - release
        - checkout_session_id
        - open_dispute_id
        - open_chargeback_id
        - flagged
        - timeline
        - external_reference
        - metadata
        - created_at
        - funded_at
        - ended_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: escrow
        livemode:
          type: boolean
        status:
          $ref: '#/components/schemas/EscrowStatus'
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          type: string
          const: NGN
        fees:
          $ref: '#/components/schemas/Fees'
        category:
          $ref: '#/components/schemas/Category'
        title:
          type: string
        description:
          type: string
        images:
          type: array
          description: KetaPay's copies of the images sent at checkout; the first is the cover
          items:
            $ref: '#/components/schemas/Image'
        attachments:
          type: array
          description: KetaPay's copies of the documents sent at checkout
          items:
            $ref: '#/components/schemas/Attachment'
        milestones:
          type: array
          description: In order. One entry for a single payment.
          items:
            $ref: '#/components/schemas/Milestone'
        buyer:
          $ref: '#/components/schemas/Party'
        seller:
          description: The seller, or your business when you sell your own goods
          oneOf:
            - $ref: '#/components/schemas/Party'
            - $ref: '#/components/schemas/BusinessSeller'
        release:
          $ref: '#/components/schemas/Release'
        checkout_session_id:
          type: string
          format: uuid
        open_dispute_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The dispute currently open, if any. `GET /escrows/{id}/disputes` lists them all.
        open_chargeback_id:
          type:
            - string
            - 'null'
          format: uuid
          description: A card chargeback currently being contested, if any
        flagged:
          type: boolean
          description: Whether you have flagged this escrow
        timeline:
          type: array
          description: What happened, oldest first
          items:
            $ref: '#/components/schemas/TimelineEntry'
        external_reference:
          $ref: '#/components/schemas/ExternalReference'
        metadata:
          $ref: '#/components/schemas/Metadata'
        created_at:
          type: string
          format: date-time
        funded_at:
          type: string
          format: date-time
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When it became `completed` or `refunded`
    DeliverMilestoneRequest:
      type: object
      properties:
        note:
          type:
            - string
            - 'null'
          maxLength: 160
          description: What was delivered, for the buyer
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/DeliveryAttachment'
    ReleaseMilestoneRequest:
      type: object
      properties:
        release_code:
          type: string
          pattern: ^\d{6}$
          description: Required for `release_code` escrows
    ReleaseCode:
      type: object
      required:
        - object
        - escrow_id
        - milestone_id
        - code
      properties:
        object:
          type: string
          const: release_code
        escrow_id:
          type: string
          format: uuid
        milestone_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^\d{6}$
          example: '731045'
    CancelEscrowRequest:
      type: object
      properties:
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
    CreateFlagRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - fraudulent_listing
            - banned_seller
            - banned_buyer
            - suspicious_activity
            - other
        note:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: What you know. Only KetaPay sees it.
    Flag:
      type: object
      required:
        - id
        - object
        - escrow_id
        - reason
        - note
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: flag
        escrow_id:
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - fraudulent_listing
            - banned_seller
            - banned_buyer
            - suspicious_activity
            - other
        note:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - pending_review
            - reviewed
        created_at:
          type: string
          format: date-time
    DisputeReason:
      type: string
      enum:
        - not_received
        - not_as_agreed
        - damaged
        - incomplete
        - buyer_unresponsive
        - other
      description: |
        Buyer reasons: `not_received` (goods or work never arrived), `not_as_agreed` (differs
        from what was agreed), `damaged`, `incomplete` (only part was delivered). Seller reason:
        `buyer_unresponsive` (delivered, but the buyer won't release or respond). Either side:
        `other`.
    CreateDisputeRequest:
      type: object
      required:
        - reason
        - description
      properties:
        milestone_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The milestone in question. Leave out for the whole escrow.
        reason:
          $ref: '#/components/schemas/DisputeReason'
        description:
          type: string
          minLength: 10
          maxLength: 2000
        files:
          type: array
          maxItems: 10
          description: First evidence, as ids from `POST /files` with purpose `dispute_evidence`
          items:
            type: string
            format: uuid
    Dispute:
      type: object
      required:
        - id
        - object
        - livemode
        - escrow_id
        - milestone_id
        - opened_by
        - status
        - reason
        - outcome
        - resolved_by
        - url
        - awaiting_evidence_from
        - evidence_due_at
        - evidence_count
        - opened_at
        - resolved_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: dispute
        livemode:
          type: boolean
        escrow_id:
          type: string
          format: uuid
        milestone_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Null when the dispute covers the whole escrow
        opened_by:
          type: string
          enum:
            - buyer
            - seller
        status:
          type: string
          enum:
            - open
            - under_review
            - resolved
          description: |
            `open`: the buyer and seller are trying to agree. `under_review`: a KetaPay mediator
            is deciding. `resolved`: ended, see `outcome`.
        reason:
          $ref: '#/components/schemas/DisputeReason'
        outcome:
          type:
            - string
            - 'null'
          enum:
            - released
            - refunded
            - partially_refunded
            - withdrawn
            - null
          description: |
            Null until resolved. `withdrawn`: the buyer withdrew the dispute and the deal
            continues. `partially_refunded`: split between buyer and seller.
        resolved_by:
          type:
            - string
            - 'null'
          enum:
            - buyer
            - seller
            - ketapay
            - null
          description: Who ended it. A party can only end it against themselves (conceding) or by withdrawing their own dispute.
        refunded_amount:
          oneOf:
            - $ref: '#/components/schemas/Amount'
            - type: 'null'
          description: For `refunded` and `partially_refunded`, the amount returned to the buyer
        url:
          type: string
          format: uri
          description: The dispute room, where the buyer and seller add evidence and talk to KetaPay
          example: https://app.ketapay.com/disputes/8e2f4a6c-1d3b-4c7e-9a5f-0b2d4f6a8c13
        awaiting_evidence_from:
          type:
            - string
            - 'null'
          enum:
            - buyer
            - seller
            - both
            - null
          description: Who KetaPay is waiting on for evidence, if anyone
        evidence_due_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Deadline for the evidence KetaPay asked for
        evidence_count:
          type: integer
          minimum: 0
          description: How many evidence submissions both sides have made
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type:
            - string
            - 'null'
          format: date-time
    SubmitEvidenceRequest:
      type: object
      required:
        - statement
      properties:
        statement:
          type: string
          minLength: 10
          maxLength: 2000
          description: What happened, in the customer's words
        files:
          type: array
          maxItems: 10
          description: Ids from `POST /files` with purpose `dispute_evidence`
          items:
            type: string
            format: uuid
    Evidence:
      type: object
      required:
        - id
        - object
        - dispute_id
        - submitted_by
        - statement
        - files
        - created_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: evidence
        dispute_id:
          type: string
          format: uuid
        submitted_by:
          type: string
          enum:
            - buyer
            - seller
        statement:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        created_at:
          type: string
          format: date-time
    FilePurpose:
      type: string
      enum:
        - delivery
        - dispute_evidence
    File:
      type: object
      required:
        - id
        - object
        - purpose
        - name
        - mime_type
        - size_bytes
        - url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: file
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        name:
          type: string
          example: Delivered designs.pdf
        mime_type:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
          maximum: 26214400
        url:
          type: string
          format: uri
          description: Short-lived link to download the file, valid for 1 hour
        created_at:
          type: string
          format: date-time
    Refund:
      type: object
      required:
        - id
        - object
        - livemode
        - escrow_id
        - milestone_id
        - amount
        - destination
        - status
        - last4
        - sent_at
        - failure_reason
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: refund
        livemode:
          type: boolean
        escrow_id:
          type: string
          format: uuid
        milestone_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        destination:
          type: string
          enum:
            - card
            - bank_account
            - ketapay_balance
          description: Where the money went. `ketapay_balance` after a failed card or bank refund.
        status:
          type: string
          enum:
            - processing
            - sent
            - failed
          description: |
            `processing`: started. `sent`: accepted by the card network or bank. `failed`: could
            not go back the way it came; a new refund with `destination` `ketapay_balance`
            follows straight away.
        last4:
          type:
            - string
            - 'null'
          description: Last 4 digits of the card or bank account
          example: '4081'
        sent_at:
          type:
            - string
            - 'null'
          format: date-time
        failure_reason:
          type:
            - string
            - 'null'
          example: Card expired
    Chargeback:
      type: object
      required:
        - id
        - object
        - livemode
        - escrow_id
        - milestone_ids
        - amount
        - reason
        - status
        - respond_by
        - recovered_from_seller
        - commission_reversed
        - opened_at
        - closed_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: chargeback
        livemode:
          type: boolean
        escrow_id:
          type: string
          format: uuid
        milestone_ids:
          type: array
          description: The milestones the reversed card payment covered
          items:
            type: string
            format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          enum:
            - fraudulent
            - not_received
            - not_as_described
            - duplicate
            - other
          description: The reason the card bank gave
        status:
          type: string
          enum:
            - needs_response
            - under_review
            - won
            - lost
          description: |
            `needs_response`: KetaPay is gathering evidence (the seller can add some until
            `respond_by`). `under_review`: with the card bank. `won`: reversed in KetaPay's
            favour, nothing changes. `lost`: the bank took the money back.
        respond_by:
          type:
            - string
            - 'null'
          format: date-time
        recovered_from_seller:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: For `lost`, how much has been recovered from the seller's balance and payouts so far
        commission_reversed:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: For `lost` after release, your commission taken back from your commission balance
        opened_at:
          type: string
          format: date-time
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
    Bank:
      type: object
      required:
        - code
        - name
        - logo_url
      properties:
        code:
          type: string
          example: '057'
        name:
          type: string
          example: Zenith Bank
        logo_url:
          type:
            - string
            - 'null'
          format: uri
    CreatePayoutAccountRequest:
      type: object
      required:
        - bank_code
        - account_number
      properties:
        bank_code:
          type: string
          description: From `GET /banks`
        account_number:
          type: string
          pattern: ^\d{10}$
          description: 10-digit NUBAN
    PayoutAccount:
      type: object
      required:
        - id
        - object
        - status
        - bank_code
        - bank_name
        - account_number_last4
        - account_name
        - created_at
        - confirmed_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: payout_account
        status:
          type: string
          enum:
            - pending_confirmation
            - active
            - inactive
            - cancelled
          description: |
            `pending_confirmation`: waiting for the seller's code. `active`: receives payouts
            (one per seller). `inactive`: replaced by a newer confirmed account. `cancelled`: not
            confirmed in time, or too many wrong codes.
        bank_code:
          type: string
        bank_name:
          type: string
          example: Zenith Bank
        account_number_last4:
          type: string
          example: '6789'
        account_name:
          type: string
          description: The name the bank holds for this account. Shown to the seller before they confirm; it does not have to match their name.
          example: TUNDE BELLO
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
    EventType:
      type: string
      enum:
        - checkout_session.expired
        - escrow.funded
        - milestone.delivered
        - milestone.released
        - escrow.completed
        - escrow.refunded
        - dispute.opened
        - dispute.evidence_requested
        - dispute.evidence_submitted
        - dispute.resolved
        - payout.sent
        - refund.sent
        - refund.failed
        - chargeback.opened
        - chargeback.closed
        - payout.failed
      description: New event types may be added. Ignore types you don't handle.
    CreateWebhookEndpointRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
        enabled_events:
          type: array
          minItems: 1
          default:
            - '*'
          description: |
            Event types to send, or `["*"]` for all, including types added later. Leave it out to
            receive every event.
          items:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: string
                const: '*'
        description:
          type:
            - string
            - 'null'
          maxLength: 200
        metadata:
          $ref: '#/components/schemas/Metadata'
    UpdateWebhookEndpointRequest:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
        enabled_events:
          type: array
          minItems: 1
          items:
            type: string
        description:
          type:
            - string
            - 'null'
          maxLength: 200
        status:
          type: string
          enum:
            - enabled
            - disabled
          description: '`enabled` re-enables a `failing` endpoint; `disabled` pauses deliveries.'
    WebhookTestResult:
      type: object
      required:
        - object
        - event_id
        - delivered
        - status_code
        - response_ms
        - error
      properties:
        object:
          type: string
          const: webhook_test_result
        event_id:
          type: string
          example: evt_test_8f2a1c
        delivered:
          type: boolean
          description: True when your endpoint answered 2xx within 10 seconds
        status_code:
          type:
            - integer
            - 'null'
          example: 200
        response_ms:
          type:
            - integer
            - 'null'
          example: 184
        error:
          type:
            - string
            - 'null'
          description: Why it failed, when no status code came back (timeout, TLS, DNS)
          example: null
    SimulateRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - deliver
            - release
            - auto_release
            - cancel
            - open_dispute
            - request_evidence
            - resolve_dispute
            - open_chargeback
            - close_chargeback
            - fail_payout
            - fail_refund
        milestone_id:
          type:
            - string
            - 'null'
          format: uuid
        actor:
          type: string
          enum:
            - buyer
            - seller
        reason:
          $ref: '#/components/schemas/DisputeReason'
        from:
          type: string
          enum:
            - buyer
            - seller
            - both
        outcome:
          type: string
          enum:
            - released
            - refunded
            - partially_refunded
        refunded_amount:
          $ref: '#/components/schemas/Amount'
        amount:
          $ref: '#/components/schemas/Amount'
        chargeback_status:
          type: string
          enum:
            - won
            - lost
    WebhookEndpoint:
      type: object
      required:
        - id
        - object
        - livemode
        - url
        - enabled_events
        - description
        - status
        - metadata
        - created_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
