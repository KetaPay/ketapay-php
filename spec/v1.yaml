      summary: Get a checkout session
      x-required-scope: checkout_sessions:read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
              examples:
                open:
