security:
  - secretKey: []
tags:
  - name: Checkout sessions
    description: |
      A checkout session is one agreement waiting to be paid. Create it from your server (the
      price and the milestones never come from the browser), then either open its `url` with
      `@ketapay/checkout` or a redirect, or show the payment details in your own UI with
      `POST /checkout_sessions/{id}/bank_transfer`. Once the buyer pays, KetaPay creates the
      escrow and sends `escrow.funded`.
  - name: Customer sessions
    description: |
      Proof that your customer, not just your platform, is making a request. KetaPay sends a
      one-time code to the customer's email, or to their phone (WhatsApp, falling back to SMS);
      your UI collects it and you exchange it for a customer token valid for 15 minutes. Send
      the token in the `KetaPay-Customer-Token` header on the calls that need it. A token only
      works for escrows where that person is the buyer or the seller, and only with the secret
      key that created it.
  - name: Escrows
    description: |
      An escrow holds the buyer's money until its milestones are released. Your key alone can
      read escrows and flag one for KetaPay to review. Delivering, releasing and cancelling also
      need the right customer's proof.
  - name: Disputes
    description: |
      Either side can open a dispute, on KetaPay's pages or through your UI: the buyer when
      something wasn't delivered as agreed, the seller when the buyer won't release or respond.
      KetaPay runs it end to end and decides from the evidence both sides submit. An escrow can
      have several disputes over its life, one per milestone at a time.

      **Settling without KetaPay.** While a dispute is open, either side can back down: the
      buyer can release, the seller can refund (`POST /disputes/{id}/concede`), and whoever
      opened it can withdraw it. Nobody can settle in their own favour; only KetaPay decides
      against a party.

      **Evidence.** The buyer and the seller each submit statements and files (photos, videos,
      documents, chat screenshots), either in the dispute room at the dispute's `url` or
      through your UI: upload each file with `POST /files`, then submit them with
      `POST /disputes/{id}/evidence`. When KetaPay needs more from someone, the dispute's
      `awaiting_evidence_from` and `evidence_due_at` say who and by when, and you get
      `dispute.evidence_requested` so you can prompt them in your app. Evidence is only visible
      to the two parties and KetaPay; your key alone cannot read it.
  - name: Payout accounts
    description: |
      Where a customer's money goes: a seller's releases, or a buyer's refund that couldn't go
      back to their card. The account can be in any name (the customer's, their business's, a
      family member's), so the protection is who can add it: only that customer, by confirming
      a one-time code sent to their email or phone. The code message names the
      bank and the last 4 digits, so the seller sees exactly what they are approving.

      Nobody else can add or change a seller's payout account: not your platform or its staff,
      not anyone holding your secret key, not someone with the seller's customer token alone,
      and not KetaPay staff. Accounts cannot be edited; a change means adding a new account and
      confirming it. Every change is logged and the seller is notified.

      Each release is paid to the seller's active payout account automatically. If they have
      none yet, or the transfer fails, the money waits safely in their KetaPay balance and is
      sent as soon as they confirm one. Each milestone's `payout` shows where its money is.
  - name: Refunds
    description: |
      Money returned to the buyer (a cancellation, a seller conceding, or a dispute KetaPay
      decided for the buyer) goes back the way it came: to the card, or to the bank account the
      transfer came from. Card refunds take 5 to 10 working days to show, depending on the
      buyer's bank.

      If that fails (the card has expired or been closed, or the sending account can't receive
      money), the refund goes to the buyer's KetaPay balance instead, and KetaPay asks the
      buyer to withdraw it to a bank account they confirm with a one-time code (the same
      `Payout accounts` flow sellers use). Refunded money is never lost and never goes to anyone
      but the buyer. Each milestone's `refund` shows where its money is.
  - name: Chargebacks
    description: |
      A chargeback is when the buyer asks their card bank to reverse a card payment, outside
      KetaPay's dispute process. Banks can allow this weeks after payment, even after the
      seller has been paid.

      **KetaPay handles every chargeback.** It contests it with the evidence the escrow already
      holds: what was agreed, what the seller delivered, and the buyer's own release (confirmed
      with a one-time code or release code, which is strong proof). The seller can add more
      through `POST /chargebacks/{id}/evidence`.

      **If the chargeback arrives before release,** the affected milestones freeze until the
      bank decides. **If KetaPay loses after release,** the amount is recovered from the
      seller's KetaPay balance and later payouts, and your commission on those milestones is
      reversed from your commission balance. If it can't be recovered from the seller, KetaPay
      absorbs the loss. You get `chargeback.opened` and `chargeback.closed`; you never need to
      act.
  - name: Files
    description: |
      Upload a file your user gave you, then refer to it by id in a milestone delivery or in
      dispute and chargeback evidence. JPEG, PNG, HEIC, WebP, PDF and MP4, up to 25 MB each.
      KetaPay keeps every file of an escrow until 180 days after its last milestone ends, and
      longer while a dispute or chargeback on it is open.
  - name: Banks
    description: Nigerian banks for your payout account form.
  - name: Webhook endpoints
    description: URLs on your server that receive events.
  - name: Test helpers
    description: Sandbox only. Drive checkout sessions and escrows through every state without real customers.
  - name: Events
    description: |
      Every change you can act on, kept for 30 days. Use the list to catch up on anything your
      endpoint missed.
paths:
  /checkout_sessions:
    post:
      operationId: createCheckoutSession
      tags:
        - Checkout sessions
      summary: Create a checkout session
      description: |
        Starts checkout for one agreement. Call this from your server with your secret key.

        **What is agreed.** `title` and `description` (both required) say what is being bought;
        `images` show it (the first is the cover on checkout, in messages and on the escrow);
        `attachments` hold documents such as a brief, a contract or title papers. KetaPay copies
        all of it when the session is created, shows the buyer that copy at checkout and keeps
        it with the escrow as evidence for any dispute, so later changes to your listing or
        record don't change what was agreed. A link that can't be downloaded fails the request.

        **Milestones.** Pass `milestones` to split the payment into stages released one at a
        time, in order. Leave it out for a single payment: KetaPay creates one milestone for
        the whole `amount`. When you pass milestones, their amounts must add up to `amount`.

        **Release.** `release.method` is `buyer_confirms` (the buyer releases each delivered
        milestone) or `release_code` (in person: the seller enters the buyer's code).
        `release.auto_release_hours` releases a delivered milestone when the buyer neither
        releases nor reports a problem in that time; leave it null where silence should never
        pay the seller, such as legal or property work.

        **Parties.** The buyer and the seller are people, each identified by an email address, a
        Nigerian phone number, or both. At least one is required; send both when you have them,
        because KetaPay messages people on every channel it knows (release codes and dispute
        deadlines are easy to miss in one inbox).

        KetaPay matches each party to a KetaPay account by email first, then phone. Someone
        without an account gets one from what you send and claims it with a one-time code to
        that email or phone, so neither side has to install KetaPay. If the email and phone
        belong to two different KetaPay accounts, the request fails with
        `party_identity_conflict`; send just one. The buyer and seller must be different
        people (`parties_must_differ`). You
        never send the seller's bank details: the seller adds them, with their own one-time
        code, on KetaPay's pages or through `POST /payout_accounts`.

        **Fees.** The buyer pays the amount plus KetaPay's fee and VAT on that fee. The seller's
        fee and your commission come out of each release. Nothing is charged to the seller or
        earned by you on money refunded to the buyer. The response shows every figure in `fees`.

        **Limits.** Amounts above the buyer's verification level are allowed here; the buyer is
        asked to verify their identity before paying (the hosted checkout does this for you).
      x-required-scope: checkout_sessions:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
            examples:
              milestones:
                summary: Services in three milestones
                value:
                  amount: 150000000
                  category: services
                  title: Company website
                  description: Five-page marketing site with blog, built on Next.js. Brief attached.
                  attachments:
                    - name: Project brief.pdf
                      url: https://files.example.com/briefs/4471.pdf
                  milestones:
                    - title: Design
                      description: Homepage and inner page designs, two revision rounds
                      amount: 40000000
                      due_date: '2026-10-24'
                    - title: Build
                      amount: 80000000
                      due_date: '2026-11-14'
                    - title: Launch
                      amount: 30000000
                      due_date: '2026-11-21'
                  buyer:
                    phone: '+2348012345678'
                    name: Ada Obi
                    email: ada@example.com
                  seller:
                    email: tunde.bello@example.com
                    phone: '+2348098765432'
                    name: Tunde Bello
                  release:
                    method: buyer_confirms
                    auto_release_hours: 168
                  commission:
                    rate_bps: 1000
                  return_url: https://example.com/projects/4471
                  external_reference: proj_4471
              single:
                summary: One-off sale handed over in person
                value:
                  amount: 45000000
                  category: goods
                  title: iPhone 15 Pro Max 256GB
                  description: Used, 91% battery, no scratches, Face ID works. Comes with box and cable.
                  images:
                    - url: https://cdn.example.com/listings/8812/1.jpg
                    - url: https://cdn.example.com/listings/8812/2.jpg
                  buyer:
                    phone: '+2348012345678'
                  seller:
                    email: tunde.bello@example.com
                  release:
                    method: release_code
                  commission:
                    rate_bps: 500
                    max_amount: 2000000
                  external_reference: ord_7781
      responses:
        '201':
          description: Checkout session created
          headers:
            KetaPay-Request-Id:
              $ref: '#/components/headers/KetaPay-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
              examples:
                open:
                  $ref: '#/components/examples/OpenCheckoutSession'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listCheckoutSessions
      tags:
        - Checkout sessions
      summary: List checkout sessions
      x-required-scope: checkout_sessions:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ExternalReference'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CheckoutSessionStatus'
      responses:
        '200':
          description: A page of checkout sessions, newest first
          content:
            application/json:
              schema:
