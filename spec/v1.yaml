        api_version:
          type: string
          const: v1
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - object
          properties:
            object:
              description: The object as it was when the event happened
              oneOf:
                - $ref: '#/components/schemas/CheckoutSession'
                - $ref: '#/components/schemas/Escrow'
                - $ref: '#/components/schemas/Dispute'
                - $ref: '#/components/schemas/Payout'
                - $ref: '#/components/schemas/Refund'
                - $ref: '#/components/schemas/Chargeback'
