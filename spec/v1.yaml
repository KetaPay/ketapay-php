        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /checkout_sessions/{id}/cancel:
    post:
      operationId: cancelCheckoutSession
      tags:
        - Checkout sessions
      summary: Cancel a checkout session
      description: |
        Closes an unpaid session so it can no longer be paid (the deal fell through, the listing
        was removed). Only `open` sessions can be cancelled; once paid, the money is in escrow
        and only the buyer, the seller or KetaPay can end it.
      x-required-scope: checkout_sessions:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled checkout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /checkout_sessions/{id}/bank_transfer:
    post:
      operationId: createCheckoutSessionBankTransfer
      tags:
        - Checkout sessions
      summary: Get bank transfer details to pay
      description: |
        For your own payment screen. Returns a one-time account number for this session; when
        the buyer transfers exactly `amount` to it before `expires_at`, the escrow is funded and
        `escrow.funded` is sent. Calling again returns the same account while it is valid.

        Needs the buyer's customer token, so the payer is verified before money is taken. If the
        amount is above the buyer's verification level, this fails with `verification_required`;
        send the buyer to the session's `url` to verify. Card payments go through KetaPay's
        secure card fields (in `@ketapay/checkout` or the hosted page) so card numbers never
        touch your servers.
      x-required-scope: checkout_sessions:write
      security:
        - secretKey: []
          customerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transfer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransferInstructions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotParty'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /customer_sessions:
    post:
      operationId: createCustomerSession
      tags:
        - Customer sessions
      summary: Send a one-time code to a customer
      description: |
        Sends a 6-digit code to the customer's email or phone (send one). Limited to 5 codes per
        email or phone per hour; a code expires after 10 minutes. Customers without a KetaPay
        account can verify too: their account is created when the code is verified.
      x-required-scope: customer_sessions:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerSessionRequest'
            example:
              phone: '+2348012345678'
      responses:
        '201':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSession'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /customer_sessions/{id}/verify:
    post:
      operationId: verifyCustomerSession
      tags:
        - Customer sessions
      summary: Exchange the code for a customer token
      description: |
        Five wrong codes end the session; start a new one. The token is returned only here and
        lasts 15 minutes. Keep it on your server and do not log it.
      x-required-scope: customer_sessions:write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OneTimeCode'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerToken'
        '400':
          $ref: '#/components/responses/CodeRejected'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /escrows:
    get:
