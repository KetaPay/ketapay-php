                propertyName: object
                mapping:
                  checkout_session: '#/components/schemas/CheckoutSession'
                  escrow: '#/components/schemas/Escrow'
                  dispute: '#/components/schemas/Dispute'
                  payout: '#/components/schemas/Payout'
                  refund: '#/components/schemas/Refund'
                  chargeback: '#/components/schemas/Chargeback'
            milestone_id:
              type:
                - string
                - 'null'
              format: uuid
              description: For `milestone.*` events, the milestone that changed
