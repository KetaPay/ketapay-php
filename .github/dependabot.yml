version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates of dev tools together; each major version gets its own PR so one
      # breaking change can't block the rest.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Dev tools must still install on PHP 8.1, the oldest PHP we support (config.platform.php):
      # PHPUnit 11+ and symfony/yaml 7+ need PHP 8.2.
      - dependency-name: phpunit/phpunit
        update-types: [version-update:semver-major]
      - dependency-name: symfony/yaml
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
