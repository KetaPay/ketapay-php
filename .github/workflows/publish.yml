# Publishes a tagged release to Packagist. Manual only: Actions tab > "Publish to Packagist" > Run workflow.
# Only dudox can run it, and only while the repo variable PACKAGIST_PUBLISH_ENABLED=true.
#
# Packagist reads versions from the repo's tags, so "publishing" means telling Packagist to read the new
# tag. The Packagist package must NOT have the GitHub auto-update hook, or every tag would go out unchecked.
#
# 1. Resolves the release tag (the latest GitHub release unless you give one), checks it is on main,
#    matches KetaPay::VERSION and isn't on Packagist yet.
# 2. Runs the whole CI suite and the E2E suite on that exact tag (E2E is required for stable releases).
# 3. Smoke-tests the archive, asks Packagist to update, and waits until the version is listed.
#
# Auth: PACKAGIST_TOKEN (Packagist API token of dudox) from Infisical (ketapay-sdks, prod).
name: Publish to Packagist

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, like v0.1.0-beta.1 (empty = the latest release)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Who, what and whether
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - name: Only dudox can publish, and only when publishing is enabled
        env:
          ACTOR: ${{ github.actor }}
          ENABLED: ${{ vars.PACKAGIST_PUBLISH_ENABLED }}
        run: |
          if [ "$ACTOR" != "dudox" ]; then echo "::error::Only dudox can publish to Packagist ($ACTOR tried)."; exit 1; fi
          if [ "$ENABLED" != "true" ]; then echo "::error::Publishing is switched off (PACKAGIST_PUBLISH_ENABLED is not true)."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --json tagName -q .tagName)}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::No tag $tag."; exit 1; fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then echo "::error::$tag is not on main."; exit 1; fi
          version=$(git show "$tag:src/KetaPay.php" | sed -n "s/.*public const VERSION = '\([^']*\)'.*/\1/p")
          if [ "$tag" != "v$version" ]; then echo "::error::$tag does not match KetaPay::VERSION $version."; exit 1; fi
          if curl -fsS https://repo.packagist.org/p2/ketapay/ketapay-php.json 2>/dev/null | grep -q "\"version\":\"$version\""; then
            echo "::error::ketapay/ketapay-php $version is already on Packagist."; exit 1
          fi
          if [[ "$version" == *-* ]]; then stable=false; else stable=true; fi
          { echo "tag=$tag"; echo "version=$version"; echo "stable=$stable"; } >> "$GITHUB_OUTPUT"
          echo "### Publishing ketapay/ketapay-php $version from \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Full CI on the release tag
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  e2e:
    name: E2E on the release tag
    needs: prepare
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      # Stable releases must pass E2E; betas run it when staging is configured.
      required: ${{ needs.prepare.outputs.stable == 'true' }}

  publish:
    name: Publish
    needs: [prepare, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Infisical login
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: 'oidc'
          oidc-audience: 'https://infisical.com'
          identity-id: 'ef5c6cbd-0f7e-49a9-a6b7-8d115c2abbd2'
          project-slug: 'ketapay-sdks-pz5w' # one Infisical project for every KetaPay SDK
          env-slug: 'prod'
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, zip
      - uses: ramsey/composer-install@v4
      - name: Smoke test the exact archive being published
        run: composer smoke:package
      - name: Ask Packagist to read the new tag
        run: |
          if [ -z "$PACKAGIST_TOKEN" ]; then echo "::error::PACKAGIST_TOKEN missing from Infisical prod"; exit 1; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=dudox&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/KetaPay/ketapay-php"}}'
      - name: Wait until Packagist lists the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://repo.packagist.org/p2/ketapay/ketapay-php.json?t=$(date +%s)" | grep -q "\"version\":\"$VERSION\""; then
              {
                echo "### Published ketapay/ketapay-php $VERSION"
                echo
                echo "Install: \`composer require ketapay/ketapay-php:$VERSION\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Packagist did not list $VERSION after 5 minutes. Check the package page."
          exit 1
